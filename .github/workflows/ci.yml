name: CI

on:
  pull_request:
  push:
    branches: [main]

# A pull request that is superseded is not worth finishing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provider
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  sdk:
    # The committed TypeScript SDK is generated from the plugin's schema; a resource change without
    # a regenerated SDK fails here rather than in a consumer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum

      - uses: pulumi/actions@v6
        with:
          # The version the committed SDK was generated with, so the comparison is like for like.
          pulumi-version: 3.273.0

      - name: Regenerate
        run: scripts/gen-sdk.sh

      - name: Compare
        run: |
          if [ -n "$(git status --porcelain -- sdk)" ]; then
            git status --short -- sdk
            echo "sdk/nodejs is stale: run scripts/gen-sdk.sh and commit the result" >&2
            exit 1
          fi

  integration:
    # Deploys every component to a kind cluster with `pulumi up`, checks it with kubectl, then
    # destroys it and checks nothing is left (tests/integration/run.sh). No GitHub credentials: the
    # scale set never registers, which is expected.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: pulumi/actions@v6
        with:
          pulumi-version: 3.273.0

      - name: Install kind
        run: go install sigs.k8s.io/kind@v0.29.0

      - name: Generate the SDK
        # The program loads sdk/nodejs; regenerating it here tests the SDK this commit's plugin makes.
        run: scripts/gen-sdk.sh

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Integration test
        run: tests/integration/run.sh

  ci:
    # The release workflow (pulumi-homelab's release.yml) releases a commit only when a check named
    # "CI" passed on it. This job is that check; add every new job to its needs.
    name: CI
    needs: [go, sdk, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Result
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a required job did not pass: $RESULTS" >&2; exit 1; }
          done
